# HaloGenesis-R default configuration.
# Units: kpc, Myr, M_sun unless the key says otherwise. Values marked "paper" are taken from the original
# HaloGenesis report; all others are chosen for this reconstruction. historical_reference is comparison-only.

meta:
  run_label: "HGR-default-v0.1"
  provenance: "chosen for the reconstruction; not historical inputs"
  seed: 20261019

axion:
  m22: 1.0                         # paper: m_a ~ 1e-22 eV
  soliton_mass_msun: 2.92e8        # paper Eq. (37)
  self_interaction_lambda: 0.0     # paper Eq. (20)

gas:
  n_cm3: 10.0                      # paper Fig. 5
  T_K: 1.0e3                       # paper Eq. (11)
  mu: 1.2
  gamma: 1.6666666666666667
  initial_velocity_kms: 0.0
  perturbation_rel_amplitude: 1.0e-3
  cooling_model: "piecewise_historical"   # piecewise_historical | primordial_h2 | isothermal | none
  cooling_params:                  # primordial_h2 only
    X_H: 0.76
    x_H2: 5.0e-4
    T_floor_K: 57.2                # T_CMB(z=20)

domain:
  box_kpc: 8.0
  N_dev: 128
  N_prod: 256
  boundary: "periodic"

time:
  t_end_myr: 30.0
  cfl_hydro: 0.3
  sp_kinetic_dt_factor: 0.1666666667
  sp_potential_phase_max_rad: 0.5
  grav_cfl: 0.3
  freefall_dt_fraction: 0.05

filter:
  kernel: "trailing_boxcar"        # trailing_boxcar | zero_lag_boxcar | delay_half_tau | ema
  tau_myr: 3.0
  tau_scan_myr: [0.0, 0.001, 1.0, 3.0, 10.0]

analysis:
  apertures_kpc: [0.25, 0.5, 1.0]  # pre-declared
  primary_aperture_kpc: 0.5
  aperture_center: "soliton"       # soliton | box
  track_radius_kpc: 0.75
  jeans_threshold: 1.0
  t_window_myr: [0.0, 30.0]
  full_snapshot_times_myr: [0.0, 1.2, 5.0, 10.0, 20.0, 30.0]

scans:
  n_cm3: [0.001, 0.01, 0.1, 1.0, 10.0]
  N_convergence: [64, 128, 256]
  m22: [0.5, 1.0, 1.23, 2.0]

compute:
  fft_workers: -1
  fft_backend: "scipy"             # scipy | pyfftw
  dtype: "float64"

viz:
  dpi: 150
  iso_max_points_per_axis: 40

historical_reference:
  soliton_mass_msun: 2.92e8
  soliton_mass_err_msun: 0.03e8
  core_radius_kpc: 0.5
  central_gas_enhancement: 50.0
  t_sim_myr: 1.2
  t_ff_reported_myr: 0.3
  jeans_duration_myr: 5.8
  total_evolution_myr_research_plan: 20.0
  min_jeans_ratio: 5.8e-3
  median_jeans_ratio: 4.3e3
  gas_mass_max_msun: 2.5e7
  epsilon_reported: [1.0e-3, 1.0e-2]
  sound_speed_reported_kms: 2.62
  averaging_window_yr: 1.0e3
  max_norm_drift: 5.4e-14
  max_energy_error: 4.0e-5
  poisson_residual_median_unnormalized: 5.2e3

# Validation thresholds (all set before the corresponding runs)
validation_p1:
  N_main: 128
  fourier_mode_rel_err_max: 1.0e-12
  gauss_mass_msun: 1.0e8
  gauss_sigma_kpc: 0.3
  gauss_bgcorr_rel_err_max: 1.0e-3
  soliton_force_rel_err_max: 1.0e-2
  box_sizes_kpc: [4.0, 8.0, 16.0]
  box_test_dx_kpc: 0.0625
  convergence_N: [16, 32, 64, 128]
  convergence_N_ref: 256
  convergence_sigmas_kpc: [0.15, 0.2, 0.3, 0.45, 0.6]
  invariance_rel_err_max: 1.0e-12
  timing_N: [32, 64, 96, 128, 192, 256]
  timing_repeats: 3

sp:
  polish_coarse_n: 32
  polish_coarse_steps: 800
  polish_coarse_dtau_T0: [0.2, 0.005]
  polish_fine_steps: 40
  polish_fine_dtau_T0: [0.005, 0.002]

hydro:
  limiter: "vanleer"               # vanleer | mc | minmod
  jeans_floor_NJ: 0.0              # 0 = off, 4 = Truelove

setup:
  kind: "isolated"                 # isolated | soliton_halo
  halo_mass_ratio: 3.0
  halo_sigma_kms: 30.0
  halo_core_kpc: 1.5
  halo_seed: 7
  halo_relax_myr: 20.0
  halo_ref_n: 32                   # halo modes drawn on this grid -> same realisation for every N >= 32

validation_p2:
  N_main: 64
  t_stationary_myr: 40.0
  rho0_variation_max: 5.0e-3
  norm_drift_max: 1.0e-12
  energy_drift_max: 1.0e-3
  packet_sigma_kpc: 0.3
  packet_t_myr: 20.0
  packet_rel_err_max: 1.0e-5
  boost_modes: 1
  boost_t_myr: 20.0
  com_err_max_kpc: 0.01
  order_N: 32
  order_t_myr: 10.0
  order_kin_factors: [0.1666666667, 0.0833333333, 0.0416666667, 0.0208333333]
  order_expected: 2.0
  order_tol: 0.3

validation_p3:
  sod_N: [100, 200, 400, 800]
  sod_t: 0.1
  sod_cfl: 0.4
  sod_l1_max_at_400: 5.0e-3
  sod_order_min: 0.8
  conservation_N: 32
  conservation_steps: 50
  conservation_rel_max: 1.0e-12
  jeans_N: 64
  jeans_kJ_modes: 2.0
  jeans_modes: [1, 3, 4]
  jeans_amp: 1.0e-4
  jeans_periods: 2.0
  jeans_rel_err_max: 2.0e-2
  hydrostatic_N: 64
  hydrostatic_log_contrast: 3.0
  hydrostatic_t_myr: 30.0
  hydrostatic_vmax_over_cs_max: 5.0e-2
  cooling_n_cm3: [0.01, 0.1, 1.0, 10.0]
  cooling_T0_K: 5.0e3
  cooling_dt_myr: 0.1
  cooling_rel_err_max: 1.0e-6

validation_p4:
  N: 32
  filter_rel_err_max: 1.0e-12
  bias_taus_myr: [0.5, 1.0, 2.0, 4.0, 8.0]
  bias_omegas_per_myr: [0.05, 0.1, 0.2, 0.5, 1.0]
  limit_n_cm3: 1.0e-6
  limit_t_myr: 10.0
  soliton_var_max: 5.0e-3
  null_identity_rel_max: 1.0e-12
  null_steps: 10
  momentum_t_myr: 10.0
  momentum_tau_values_myr: [0.0, 3.0]
  momentum_rel_max_tau0: 1.0e-2

validation_p4x:
  N: 48
  t_myr: 30.0
  halo_fluct_factor_min: 10.0
  floor_NJ: 4.0
  floor_rel_tol: 1.0e-12
  cool_order_tol: 0.15

p5:
  N: 48
  t_end_myr: 30.0
  dt_max_myr: 0.25
  dt_min_abort_myr: 1.0e-4
  viz_radii_kpc: [0.1, 0.15, 0.25, 0.35, 0.5, 0.75, 1.0, 1.5]
  early_window_myr: 2.0
  o3_early_min: 0.9
  flux_consistency_max: 0.05

# P6 decision rules (pre-declared). O1/ΔlnQ robust iff sign stable across N and
# |F(N_max)| > |F(N_max) − F(N_prev)| (+ time-step error, + k·σ_seeds when available).
# τ effect: error of the difference Δ(τ) from resolution + 2σ halo realisations + time step.
p6:
  eval_times_myr: [5.0, 10.0, 20.0, 30.0]
  truelove_max: 0.25
  o2_saturation: 0.95
  o3_early_min: 0.9
  momentum_budget_early_max: 0.05
  flux_residual_M0_max: 0.02
  floor_mass_fraction_max: 0.1
  seed_sigma_factor: 2.0

# Probes and linear response theory (idea B)
response:
  probe_shells_kpc: [2.0, 3.0]
  probes_per_shell: 48
  highpass_myr: 6.0
  damping_per_myr: 0.05
  t_skip_myr: 6.0
  resample_dt_myr: 0.25
  verdict_sign_change_factor: 1.5   # (i) simulated sign change of r0 within this factor of theory
  verdict_rank_corr_min: 0.8        # (ii) Spearman(r0_sim, r0_theory)

validation_p7:
  filter_omega_tau: [0.3, 1.0, 3.0, 10.0]
  filter_dt_over_tau: 0.02
  filter_rel_err_max: 0.02
  drive_N: 32
  drive_omega_over_ws: [0.3, 0.6, 1.5, 2.5]
  drive_rel_err_max: 0.03
  granule_N: 48
  granule_box_kpc: 16.0
  granule_rel_err_max: 0.05
  granule_var_rel_err_max: 0.05
