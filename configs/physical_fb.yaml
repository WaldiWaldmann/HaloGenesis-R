# =============================================================================
# HaloGenesis-R  –  Default-Konfiguration (Paket P0)
# -----------------------------------------------------------------------------
# PROVENIENZ: Alle Werte in den Blöcken axion/gas/domain/time/filter/analysis/
# scans sind für die Rekonstruktion NEU GEWÄHLT. Sie sind KEINE historischen
# Werte des Original-HaloGenesis (Repository nicht mehr verfügbar).
# Werte, die aus der Originalarbeit übernommen wurden, sind mit
# "# quelle: Originalarbeit ..." markiert. Historische Vergleichswerte stehen
# ausschließlich im Block historical_reference und werden NIE als Eingabe benutzt.
#
# Einheiten-Konvention: Längen kpc, Zeiten Myr, Massen M_sun, sofern der
# Schlüssel nichts anderes sagt (_cm3, _K, _kms ...).
# =============================================================================

meta:
  run_label: "HGR-physfb-v0.1"
  provenance: "NEU GEWAEHLT (Rekonstruktion, Okt. 2026) - keine historischen Eingabewerte"
  seed: 20261019            # RNG-Seed fuer Gas-Stoerungen (numpy.random.Generator)

axion:
  m22: 1.0                  # m_a / 1e-22 eV ; quelle: Originalarbeit "m_a ~ 1e-22 eV"
  soliton_mass_msun: 2.92e8 # quelle: Originalarbeit Gl. (37) (Gesamtmasse des Solitons)
  self_interaction_lambda: 0.0   # quelle: Originalarbeit Gl. (20)

gas:
  n_cm3: 0.27               # f_b·ρ_a(0): f_b = 0.157 (Planck 2018), ρ_a(0) = 5.13e7 M_sun/kpc³ (P2) -> EINZIGE Änderung ggü. default
  T_K: 1.0e3                # quelle: Originalarbeit Gl. (11)
  mu: 1.2                   # mittleres Molekulargewicht; quelle: Originalarbeit Gl. (11)
  gamma: 1.6666666666666667 # adiabatischer Index 5/3; quelle: Originalarbeit Gl. (11)
  initial_velocity_kms: 0.0
  perturbation_rel_amplitude: 1.0e-3   # weisses Rauschen auf rho_b (Seed s.o.), identisch in A=0/A=1
  cooling_model: "piecewise_historical" # Form aus Originalarbeit 4.3.4 | "primordial_h2" (B6) | "isothermal" | "none"
  cooling_params:                       # nur für primordial_h2 (B6), NEU GEWÄHLT
    X_H: 0.76                           # Wasserstoff-Massenanteil (primordial)
    x_H2: 5.0e-4                        # feste H2-Fraktion (Größenordnung Tegmark et al. 1997)
    T_floor_K: 57.2                     # T_CMB(z=20) = 2.725·21 K

domain:
  box_kpc: 8.0              # ~10 r_c, damit periodische Bilder klein bleiben (P1 quantifiziert das)
  N_dev: 128
  N_prod: 256
  boundary: "periodic"      # bewusst KEIN Sponge-Layer (Sponge zerstoert Normerhaltung)

time:
  t_end_myr: 30.0
  cfl_hydro: 0.3                    # quelle: Originalarbeit Gl. (32)
  sp_kinetic_dt_factor: 0.1666666667 # dt_SP <= f * dx^2/(hbar/m)  (1/6-Regel)
  sp_potential_phase_max_rad: 0.5    # dt_SP <= phi_max * (hbar/m) / |Phi|_max
  grav_cfl: 0.3                      # dt <= C sqrt(dx/max|g|)   (Selbstgravitation, ab P4)
  freefall_dt_fraction: 0.05         # dt <= f t_ff(max rho)     (Kollaps zeitlich auflösen)

filter:
  kernel: "trailing_boxcar"  # Research Plan Gl. (42)
  tau_myr: 3.0
  tau_scan_myr: [0.0, 0.001, 1.0, 3.0, 10.0]   # 0.001 Myr = historisches Delta T ~ 1e3 yr (Gl. 14)

analysis:
  apertures_kpc: [0.25, 0.5, 1.0]   # VORAB deklariert (kein Radius-Tuning nach Ergebnis)
  primary_aperture_kpc: 0.5         # = historisches r_c
  aperture_center: "soliton"        # VORAB (v0.9): "soliton" = Schwerpunkt |ψ|² (mitlaufend), "box" = fest
  track_radius_kpc: 0.75            # Suchradius der Zentrumsverfolgung (≈ r_c)
  jeans_threshold: 1.0
  t_window_myr: [0.0, 30.0]
  full_snapshot_times_myr: [0.0, 1.2, 5.0, 10.0, 20.0, 30.0]

scans:
  n_cm3: [0.001, 0.01, 0.1, 1.0, 10.0]
  N_convergence: [64, 128, 256]
  m22: [0.5, 1.0, 1.23, 2.0]        # 1.23: Wert, bei dem M=2.92e8 und r_c=0.5 kpc gleichzeitig gelten (P0 prueft)

compute:
  fft_workers: -1            # -1 = alle Kerne (Kampagnen-Runner setzt bei --jobs automatisch weniger)
  fft_backend: "scipy"       # "scipy" (pocketfft) | "pyfftw" (oft 1.3–2× schneller; pip install pyfftw)
  dtype: "float64"

viz:
  dpi: 150
  iso_max_points_per_axis: 40  # Downsampling fuer interaktive 3D-HTML (Dateigroesse)

# -----------------------------------------------------------------------------
# Nur zum Vergleich. Wird von keinem Solver gelesen.
# -----------------------------------------------------------------------------
historical_reference:
  soliton_mass_msun: 2.92e8
  soliton_mass_err_msun: 0.03e8
  core_radius_kpc: 0.5
  central_gas_enhancement: 50.0
  t_sim_myr: 1.2
  t_ff_reported_myr: 0.3
  jeans_duration_myr: 5.8
  total_evolution_myr_research_plan: 20.0
  min_jeans_ratio: 5.8e-3
  median_jeans_ratio: 4.3e3
  gas_mass_max_msun: 2.5e7
  epsilon_reported: [1.0e-3, 1.0e-2]
  sound_speed_reported_kms: 2.62
  averaging_window_yr: 1.0e3
  max_norm_drift: 5.4e-14
  max_energy_error: 4.0e-5
  poisson_residual_median_unnormalized: 5.2e3

# -----------------------------------------------------------------------------
# P1-Validierung: Akzeptanzschwellen VOR dem ersten Lauf festgelegt.
# Begründung je Schwelle im P1-Report.
# -----------------------------------------------------------------------------
validation_p1:
  N_main: 128
  fourier_mode_rel_err_max: 1.0e-12      # Einzelmode: exakt bis Rundung
  gauss_mass_msun: 1.0e8
  gauss_sigma_kpc: 0.3
  gauss_bgcorr_rel_err_max: 1.0e-3       # Φ_per − Φ_iso − Φ_bg − C für r < L/4 (Restterm O(r⁴/L⁵))
  soliton_force_rel_err_max: 1.0e-2      # radiale Kraft, r in [2dx, L/4], mit Hintergrundkorrektur
  box_sizes_kpc: [4.0, 8.0, 16.0]        # Boxgrößen-Sensitivität bei festem dx
  box_test_dx_kpc: 0.0625
  convergence_N: [16, 32, 64, 128]
  convergence_N_ref: 256
  convergence_sigmas_kpc: [0.15, 0.2, 0.3, 0.45, 0.6]
  invariance_rel_err_max: 1.0e-12        # Konstante, Linearität, Translation
  timing_N: [32, 64, 96, 128, 192, 256]
  timing_repeats: 3

# -----------------------------------------------------------------------------
# P2: Schrödinger-Sektor
# -----------------------------------------------------------------------------
sp:
  polish_coarse_n: 32                 # imaginäre Zeit erst grob (billig) ...
  polish_coarse_steps: 800
  polish_coarse_dtau_T0: [0.2, 0.005] # geometrisch fallend, Einheit T0 = L0²/(ħ/m)
  polish_fine_steps: 40               # ... dann kurz auf dem Zielgitter
  polish_fine_dtau_T0: [0.005, 0.002]

hydro:
  limiter: "vanleer"                  # vanleer | mc | minmod
  jeans_floor_NJ: 0.0                 # B5: 0 = aus (Reproduktion); 4 = Truelove (λ_J ≥ 4 dx erzwungen)

# -----------------------------------------------------------------------------
# B4: Anfangskonfiguration des Axionfeldes
# -----------------------------------------------------------------------------
setup:
  kind: "isolated"                    # "isolated" (Grundzustand) | "soliton_halo" (Soliton + granularer Halo)
  halo_mass_ratio: 3.0                # M_Halo / M_Soliton (in der Box)
  halo_sigma_kms: 30.0                # 1D-Geschwindigkeitsdispersion des Zufallsphasen-Halos
  halo_core_kpc: 1.5                  # Kernradius der Hüllkurve ρ ∝ 1/(1+(r/r_h)²)
  halo_seed: 7
  halo_relax_myr: 20.0                # SP-Vorrelaxation ohne Gas vor t = 0

validation_p2:
  N_main: 64                          # Entwicklung; für Produktion 128 setzen
  t_stationary_myr: 40.0
  rho0_variation_max: 5.0e-3          # Soliton-Zentraldichte über t_stationary
  norm_drift_max: 1.0e-12
  energy_drift_max: 1.0e-3
  packet_sigma_kpc: 0.3
  packet_t_myr: 20.0
  packet_rel_err_max: 1.0e-5          # freies Wellenpaket vs. analytisch (Bildeffekte ~1e-7)
  boost_modes: 1                      # v = (ħ/m)·2π·n/L (periodisch zulässig)
  boost_t_myr: 20.0
  com_err_max_kpc: 0.01
  order_N: 32
  order_t_myr: 10.0
  order_kin_factors: [0.1666666667, 0.0833333333, 0.0416666667, 0.0208333333]
  order_expected: 2.0
  order_tol: 0.3

validation_p3:
  sod_N: [100, 200, 400, 800]
  sod_t: 0.1
  sod_cfl: 0.4
  sod_l1_max_at_400: 5.0e-3
  sod_order_min: 0.8                  # Unstetigkeiten: ~1. Ordnung erwartet
  conservation_N: 32
  conservation_steps: 50
  conservation_rel_max: 1.0e-12
  jeans_N: 64
  jeans_kJ_modes: 2.0                 # k_J = 2·(2π/L)
  jeans_modes: [1, 3, 4]              # 1 instabil, 3/4 stabil
  jeans_amp: 1.0e-4
  jeans_periods: 2.0
  jeans_rel_err_max: 2.0e-2
  hydrostatic_N: 64
  hydrostatic_log_contrast: 3.0       # ln(ρ_Zentrum/ρ_Rand) -> bestimmt Test-Temperatur
  hydrostatic_t_myr: 30.0
  hydrostatic_vmax_over_cs_max: 5.0e-2
  cooling_n_cm3: [0.01, 0.1, 1.0, 10.0]
  cooling_T0_K: 5.0e3
  cooling_dt_myr: 0.1
  cooling_rel_err_max: 1.0e-6

# -----------------------------------------------------------------------------
# P4: Kopplung (Validierung auf kleinem Gitter)
# -----------------------------------------------------------------------------
validation_p4:
  N: 32
  filter_rel_err_max: 1.0e-12          # konstantes und lineares Φ müssen exakt gemittelt werden
  bias_taus_myr: [0.5, 1.0, 2.0, 4.0, 8.0]
  bias_omegas_per_myr: [0.05, 0.1, 0.2, 0.5, 1.0]
  limit_n_cm3: 1.0e-6                  # vernachlässigbares Gas -> Soliton muss stationär bleiben
  limit_t_myr: 10.0
  soliton_var_max: 5.0e-3
  null_identity_rel_max: 1.0e-12       # ψ ≡ 0 -> Zweige A=1 und A=0 identisch
  null_steps: 10
  momentum_t_myr: 10.0
  momentum_tau_values_myr: [0.0, 3.0]
  momentum_rel_max_tau0: 1.0e-2        # τ=0: Impuls nur bis Splitting-Fehler erhalten

# -----------------------------------------------------------------------------
# P5: gematchter Lauf A=1/A=0 und Observablen
# -----------------------------------------------------------------------------
p5:
  N: 48                                # Entwicklung (1 Kern); Laptop: 128, Produktion (P6): 256
  t_end_myr: 30.0
  dt_max_myr: 0.25                     # Obergrenze -> zeitliche Auflösung der Q-Übergänge
  dt_min_abort_myr: 1.0e-4             # Abbruch bei Kollaps auf Gitterskala (wird BERICHTET)
  viz_radii_kpc: [0.1, 0.15, 0.25, 0.35, 0.5, 0.75, 1.0, 1.5]
  early_window_myr: 2.0                # O3- und Impulsbudget-Test im Frühzeitregime
  o3_early_min: 0.9                    # Gl. 30: O3 -> 1 für t -> t0
  flux_consistency_max: 0.05           # |ΔM_direkt − ∫Fluss dt| / max|ΔM|

# -----------------------------------------------------------------------------
# P6: Falsifikationsmatrix – Entscheidungsregeln VOR den Produktionsläufen festgelegt
# (Research Plan §13.3, §15, §16.4–16.5). Gilt für alle Läufe dieses run_label.
# -----------------------------------------------------------------------------
p6:
  eval_times_myr: [5.0, 10.0, 20.0, 30.0]   # feste Auswertezeiten, interpoliert
  truelove_max: 0.25                        # J ≤ 1/4 bis t, sonst Zeitpunkt "nicht aufgelöst"
  o2_saturation: 0.95                       # O2(A=0) ≥ Wert -> Original-O2 nicht diskriminierend
  o3_early_min: 0.9                         # frühe Kohärenz in JEDER Auflösung
  momentum_budget_early_max: 0.05
  flux_residual_M0_max: 0.02                # max|ΔM − ∫F dt| / M(0), neu normiert (statt /max|ΔM|)
  floor_mass_fraction_max: 0.1              # B5: Anteil gebodeter Gasmasse in Primärapertur, darüber "bodendominiert"
  seed_sigma_factor: 2.0
  # Zeitverfeinerung (v0.9, vorab): Fehlerschätzung e_t = |F(dt) − F(dt/2)|; robust nur wenn
  # |F(N_max)| > e_Ort + e_Zeit                    # B7: robust nur wenn |Wert| > k·σ_Seeds (falls Seed-Studie vorhanden)
  # O1 und ΔlnQ = ln(Q1/Q0) gelten als robust, wenn (i) das Vorzeichen über alle N gleich ist und
  # (ii) |Wert(N_max)| > |Wert(N_max) − Wert(N_vorletzt)| (Diskretisierungsfehler-Schätzung).

# -----------------------------------------------------------------------------
# P4X: Validierung der Modellerweiterungen B4–B7 (Schwellen vorab)
# -----------------------------------------------------------------------------
validation_p4x:
  N: 48
  t_myr: 30.0
  halo_fluct_factor_min: 10.0      # σ(Φ_c) mit Halo ≥ 10× isolierter Grundzustand
  floor_NJ: 4.0
  floor_rel_tol: 1.0e-12           # nach Boden: max J ≤ 1/N_J (bis Rundung)
  cool_order_tol: 0.15             # implizite primordiale Kühlung: Ordnung 1 ± tol
